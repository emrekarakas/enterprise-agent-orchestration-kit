name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore EnterpriseAgentOrchestrationKit.slnx
      - name: Format
        run: dotnet format EnterpriseAgentOrchestrationKit.slnx --verify-no-changes --no-restore
      - name: Build
        run: dotnet build EnterpriseAgentOrchestrationKit.slnx --configuration Release --no-restore
      - name: Validate Azure Bicep
        run: az bicep build --file deploy/azure/main.bicep --stdout > /dev/null
      - name: Test
        env:
          TESTCONTAINERS_ENABLED: "true"
        run: dotnet test EnterpriseAgentOrchestrationKit.slnx --configuration Release --no-build --collect:"XPlat Code Coverage"
      - name: Evaluation smoke gate
        env:
          ASPNETCORE_ENVIRONMENT: Development
        run: |
          dotnet run --project src/Orchestrator.Api/Orchestrator.Api.csproj --configuration Release --no-build --no-launch-profile --urls http://127.0.0.1:8080 > /tmp/agent-kit-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health/live > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/health/live > /dev/null
          python3 evaluations/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-smoke-report
          path: evaluations/results/smoke-report.json
          if-no-files-found: warn

  document-worker-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build Python test image
        run: docker build --target test -t enterprise-agent-kit-document-worker-tests src/document-worker
      - name: Run pytest
        run: docker run --rm enterprise-agent-kit-document-worker-tests

  full-stack-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Build and start the local platform
        run: docker compose up --detach --build --wait
      - name: Run upload-to-answer and approval journey
        run: bash tests/e2e/full-stack.sh
      - name: Capture service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the local platform
        if: always()
        run: docker compose down --volumes

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: src/Orchestrator.Api/Dockerfile
          push: false
          tags: enterprise-agent-kit:ci
          load: true
      - name: Verify local secret files are absent from the API image
        run: docker run --rm --entrypoint sh enterprise-agent-kit:ci -c 'test ! -e /app/appsettings.Development.json && test ! -e /app/appsettings.Local.json'
      - uses: docker/build-push-action@v7
        with:
          context: src/document-worker
          file: src/document-worker/Dockerfile
          push: false
          tags: enterprise-agent-document-worker:ci
          load: true
      - uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: enterprise-agent-kit:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: enterprise-agent-document-worker:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
