[project]
name = "enterprise-agent-document-worker"
version = "0.1.0"
description = "Document extraction and indexing worker for Enterprise Agent Orchestration Kit"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.121.3",
  "httpx==0.28.1",
  "openpyxl==3.1.5",
  "pydantic-settings==2.12.0",
  "pypdf==6.3.0",
  "python-docx==1.2.0",
  "python-multipart==0.0.20",
  "python-pptx==1.0.2",
  "uvicorn[standard]==0.38.0",
]

[project.optional-dependencies]
test = ["pytest==9.2.0", "pytest-asyncio==1.3.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
